# TEMPORARY development helper — builds vendor/ on CI (the sandbox has no
# Packagist access) and delivers it as vendor-cache.tar.gz on the session
# branch so the sandbox can run the PHP test suite locally. The tarball is
# removed again before release; this file is removed before release too.
name: Vendor cache

on:
  push:
    branches: ['arena/**']

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          composer require --no-update "illuminate/support:12.*" "laravel/cashier:^16.0"
          composer require --dev --no-update "orchestra/testbench:^10.0" "pestphp/pest:^3.0"
          composer config allow-plugins.pestphp/pest-plugin true
          composer update --prefer-dist --no-interaction
      - name: Commit vendor tarball onto the session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tar czf vendor-cache.tar.gz vendor composer.lock
          ls -la vendor-cache.tar.gz
          git add -f vendor-cache.tar.gz
          if ! git commit -m "chore: vendor cache payload for ${GITHUB_SHA}"; then
            echo "::error::COMMIT FAILED"
            exit 1
          fi
          if ! git push origin "HEAD:refs/heads/arena/ab737d4d-larasaas" 2>push_err.txt; then
            echo "::error::PUSH FAILED: $(head -c 600 push_err.txt)"
            exit 1
          fi
          echo "::notice::VENDOR CACHE PUSHED at $(git rev-parse HEAD)"
